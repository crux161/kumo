[package]
name = "persona-linux-shim"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

# SH7 (PLAN.md §10, ratified R1): the in-process Linux personality runtime. It is the
# process image; it loads the foreign program into its own address space and serves the
# program's redirected syscalls. Native-only, like every userland image.
[target.'cfg(target_os = "none")'.dependencies]
kumo-rt = { path = "../kumo-rt" }
kumo-abi.workspace = true
persona-linux = { path = "../persona-linux" }
# SH7-d2 (j890): the Linux file surface speaks kumo-vfs to the persona's filesystem grant.
kumo-vfs = { path = "../../lib/kumo-vfs" }

[[bin]]
name = "persona-linux-shim"
path = "src/main.rs"
test = false
bench = false
doctest = false
