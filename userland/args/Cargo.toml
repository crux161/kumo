#j913
[package]
name = "args"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

# Runtime deps gated to the image target (aarch64), like the other userland bins: the
# bin is only ever built for aarch64-unknown-none via `cargo xtask image`.
# j913: freestanding x86 too (PLAN/026 U3a); the Mac host is aarch64, so host builds keep these.
[target.'cfg(any(target_arch = "aarch64", target_os = "none"))'.dependencies]
kumo-rt = { path = "../kumo-rt" }
kumo-abi.workspace = true

[[bin]]
name = "args"
path = "src/main.rs"
test = false
bench = false
doctest = false
