[package]
name = "hello"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

# Native image dependencies stay out of host builds, but both freestanding backends
# compile the same program and KUMO syscall surface.
[target.'cfg(target_os = "none")'.dependencies]
kumo-rt = { path = "../kumo-rt" }
kumo-abi.workspace = true

[[bin]]
name = "hello"
path = "src/main.rs"
test = false
bench = false
doctest = false
