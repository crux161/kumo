#j547
#j913

[package]
name = "cat"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

# Runtime deps gated to the image target (aarch64), like the other native bins:
# the bin is built for aarch64-unknown-none by `cargo xtask image`.
# j913: freestanding x86 too (PLAN/026 U3a); the Mac host is aarch64, so host builds keep these.
[target.'cfg(any(target_arch = "aarch64", target_os = "none"))'.dependencies]
kumo-rt = { path = "../kumo-rt" }
kumo-abi.workspace = true
# j547: the filesystem protocol, for a `/media` path Sora grants a `fatfs` for.
kumo-vfs = { path = "../../lib/kumo-vfs" }

[[bin]]
name = "cat"
path = "src/main.rs"
test = false
bench = false
doctest = false
