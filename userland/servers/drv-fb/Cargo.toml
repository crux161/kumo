[package]
name = "drv-fb"
version = "0.1.0"
edition = "2021"

[lib]
name = "drv_fb"
path = "src/lib.rs"
test = true
doctest = false

[dependencies]
# Named on every target: `rk3588_mode::register_index` uses kumo-abi's checked display
# register selectors in the host-tested lib too. Gating it to aarch64 hid that on Apple
# Silicon hosts and broke `cargo test` for drv-fb (and Sora) on x86_64 hosts.
kumo-abi = { path = "../../../lib/kumo-abi" }
kumo-graphics = { path = "../../../lib/kumo-graphics" }
kumo-fdt = { path = "../../../lib/kumo-fdt" }
# F2c: the pure-Rust rasterizer behind the glyph atlas (PLAN/015 §3.2). Vendored under
# vendor/cargo; no_std plus its `libm` feature, which also selects core_maths through
# ttf-parser's no-std-float path, so the same build serves host tests and the aarch64 image.
ab_glyph = { version = "0.2.32", default-features = false, features = ["libm"] }

[[bin]]
name = "drv-fb"
path = "src/main.rs"
test = false
bench = false
doctest = false

# Gated to aarch64 (the image target) so `cargo test -p drv-fb` exercises the pure
# rendering lib without dragging in the runtime — the svc-health pattern.
[target.'cfg(target_arch = "aarch64")'.dependencies]
kumo-rt = { path = "../../kumo-rt" }
