#j563
#j913

[package]
name = "identityd"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
kumo-identity = { path = "../../../lib/kumo-identity" }

[dev-dependencies]
# The tests mint real PHC strings, which needs `alloc`.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }

# j913: freestanding x86 too (PLAN/026 U3a); the Mac host is aarch64, so host builds keep these.
[target.'cfg(any(target_arch = "aarch64", target_os = "none"))'.dependencies]
kumo-abi = { path = "../../../lib/kumo-abi" }
kumo-rt = { path = "../../kumo-rt" }

[lib]
test = true
doctest = false

# The resident binary, built for the image target only, so `cargo test -p identityd` runs the
# serve loop on the host without the runtime (the svc-health split).
[[bin]]
name = "identityd"
path = "src/main.rs"
test = false
bench = false
doctest = false
