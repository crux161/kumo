#j913
[package]
name = "svc-health"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]

# j913: freestanding x86 too (PLAN/026 U3a); the Mac host is aarch64, so host builds keep these.
[target.'cfg(any(target_arch = "aarch64", target_os = "none"))'.dependencies]
kumo-abi.workspace = true
kumo-rt = { path = "../../kumo-rt" }

[lib]
path = "src/lib.rs"
test = true
doctest = false

[[bin]]
name = "svc-health"
path = "src/main.rs"
test = false
bench = false
doctest = false
