[package]
name = "fatfs"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
kumo-fatfs = { path = "../../../lib/kumo-fatfs" }
kumo-vfs = { path = "../../../lib/kumo-vfs" }

[lib]
test = true

# j508: the resident binary. Gated to aarch64 (the image target) so
# `cargo test -p fatfs` still exercises the pure handler logic on the host
# without dragging in the runtime — the same split drv-blk uses.
[[bin]]
name = "fatfs"
path = "src/main.rs"
test = false
bench = false
doctest = false

[target.'cfg(target_arch = "aarch64")'.dependencies]
kumo-rt = { path = "../../kumo-rt" }
kumo-abi = { path = "../../../lib/kumo-abi" }
