#j913

[package]
name = "fatfs"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
drv-blk = { path = "../drv-blk" }
kumo-fatfs = { path = "../../../lib/kumo-fatfs" }
kumo-vfs = { path = "../../../lib/kumo-vfs" }

[lib]
test = true

# j508: the resident binary. Gated to aarch64 (the image target) so
# `cargo test -p fatfs` still exercises the pure handler logic on the host
# without dragging in the runtime — the same split drv-blk uses.
[[bin]]
name = "fatfs"
path = "src/main.rs"
test = false
bench = false
doctest = false

# j913: freestanding x86 too (PLAN/026 U3a); the Mac host is aarch64, so host builds keep these.
[target.'cfg(any(target_arch = "aarch64", target_os = "none"))'.dependencies]
kumo-rt = { path = "../../kumo-rt" }
kumo-abi = { path = "../../../lib/kumo-abi" }
