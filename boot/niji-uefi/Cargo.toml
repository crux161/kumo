#j801
#j804
#j805
#j810
#j933
[package]
name = "niji-uefi"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
kumo-abi.workspace = true
niji-loader = { path = "../niji-loader" }
kumo-sha256.workspace = true
# zstd decoder for the compressed netboot initrd (PROPOSAL/025 Z1); MIT, no dependencies.
ruzstd = { version = "=0.8.3", default-features = false }
# j933: the SH8-g layout constants (optional; only nvme-prepare-root links it).
kumo-gpt = { path = "../../lib/kumo-gpt", optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "niji-uefi"
path = "src/main.rs"

[features]
ax88-oracle = []
nvme-oracle = []
nvme-prepare = ["nvme-oracle"]
# j933 (SH8-g): add the RedoxFS root partition to the J804-prepared SSD.
nvme-prepare-root = ["nvme-prepare", "dep:kumo-gpt"]
# j933: re-image the SH8-g root partition (contents lost); its own token, never default.
nvme-prepare-root-reimage = ["nvme-prepare-root"]
nvme-write-reference = ["nvme-oracle"]

[dev-dependencies]
kumo-fatfs = { path = "../../lib/kumo-fatfs" }
kumo-gpt = { path = "../../lib/kumo-gpt" }

[[example]]
name = "nvme-layout"
required-features = ["nvme-prepare"]
