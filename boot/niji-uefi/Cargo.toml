#j800
#j801
#j804
#j805
#j810
[package]
name = "niji-uefi"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
kumo-abi.workspace = true
niji-loader = { path = "../niji-loader" }
kumo-sha256.workspace = true
# zstd decoder for the compressed netboot initrd (PROPOSAL/025 Z1); MIT, no dependencies.
ruzstd = { version = "=0.8.3", default-features = false }

[lib]
path = "src/lib.rs"

[[bin]]
name = "niji-uefi"
path = "src/main.rs"

[features]
ax88-oracle = []
nvme-oracle = []
nvme-prepare = ["nvme-oracle"]
nvme-write-reference = ["nvme-oracle"]

[dev-dependencies]
kumo-fatfs = { path = "../../lib/kumo-fatfs" }
kumo-gpt = { path = "../../lib/kumo-gpt" }

[[example]]
name = "nvme-layout"
required-features = ["nvme-prepare"]
