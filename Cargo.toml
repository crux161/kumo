[workspace]
members = [
    "boot/niji-loader",
    "boot/niji-uefi",
    "hal/kumo-hal",
    "hal/kumo-hal-aarch64",
    "hal/kumo-hal-x86_64",
    "imager",
    "kernel",
    "lib/kumo-abi",
    "lib/kumo-bsp",
    "lib/kumo-fatfs",
    "lib/kumo-hid",
    "lib/kumo-i2c-hid",
    "lib/kumo-ipc",
    "lib/kumo-pdc",
    "lib/kumo-virtio",
    "lib/kumo-vfs",
    "lib/kumo-xhci",
    "tools/stage-a-smoke",
    "userland/args",
    "userland/cat",
    "userland/wc",
    "userland/hello",
    "userland/ls",
    "userland/lua-repl",
    "userland/threads",
    "userland/kumo-rt",
    "userland/kumoza",
    "userland/persona-linux",
    "userland/persona-posix",
    "userland/servers/drv-blk",
    "userland/servers/drv-fb",
    "userland/servers/drv-i2c-hid",
    "userland/servers/drv-xhci",
    "userland/servers/drv-serial",
    "userland/servers/fatfs",
    "userland/servers/svc-health",
    "userland/servers/ttyd",
    "userland/sora",
    "vendor/qrcodegen",
    "xtask",
]
resolver = "2"
exclude = [
    "vendor/cargo/gc-arena-0.5.3",
    "vendor/cargo/libm-0.2.16",
    "vendor/cargo/piccolo-0.3.3",
    "vendor/cargo/thiserror-1.0.69",
    "vendor/cargo/thiserror-impl-1.0.69",
]

[workspace.package]
authors = ["KUMO contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
kumo-abi = { path = "lib/kumo-abi" }
kumo-bsp = { path = "lib/kumo-bsp" }
kumo-hal = { path = "hal/kumo-hal", default-features = false }
kumo-hal-aarch64 = { path = "hal/kumo-hal-aarch64" }
kumo-hal-x86_64 = { path = "hal/kumo-hal-x86_64" }
kumo-ipc = { path = "lib/kumo-ipc" }
kumo-pdc = { path = "lib/kumo-pdc" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.dev]
panic = "abort"
