[target.aarch64-unknown-kumo]
linker = "/tools/rust-lld"
rustflags = ["--sysroot=/sdk", "-Clink-arg=-T/sdk/share/kumo/link.ld"]

[host]
linker = "/tools/rust-lld"
rustflags = ["-Ctarget-feature=-crt-static", "-Zunstable-options", "-Clinker-flavor=gnu-lld", "-Clink-arg=-L/lib", "-Clink-arg=-L/usr/lib"]
